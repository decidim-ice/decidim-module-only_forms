# Reproduces GitLab CI ruby::rspec: ruby:3.2.2 + postgis/postgis:17-3.6-alpine + redis.
# Usage:
#   docker compose -f docker-compose.ci.yml run --rm rspec
#   docker compose -f docker-compose.ci.yml run --rm rspec bundle exec rspec spec/lib
# Not for interactive development — use docker-compose.yml.

name: only-forms-ci

services:
  postgres:
    image: postgis/postgis:17-3.6-alpine
    environment:
      POSTGRES_DB: decidim_test
      POSTGRES_USER: decidim
      POSTGRES_PASSWORD: "TEST-insecure_password"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decidim -d decidim_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest

  rspec:
    image: ruby:3.2.2
    working_dir: /app
    volumes:
      - .:/app
    shm_size: "2gb"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: decidim
      DATABASE_PASSWORD: "TEST-insecure_password"
      DISABLED_DOCKER_COMPOSE: "true"
      DISABLE_SPRING: "1"
      NODE_MAJOR: "18"
      SIMPLECOV: "1"
      CI: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: []
    command:
      - /bin/bash
      - -c
      - bin/ci-setup && unset DATABASE_URL && RAILS_ENV=test bundle exec rspec
