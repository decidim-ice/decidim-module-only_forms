stages:
  - lint
  - test

# Local CI parity: docker compose -f docker-compose.ci.yml run --rm rspec
# (see bin/ci-setup).

variables:
  POSTGRES_DB: decidim_test
  POSTGRES_USER: decidim
  POSTGRES_PASSWORD: "TEST-insecure_password"

services:
  - name: postgis/postgis:17-3.6-alpine
    alias: postgres
  - name: redis:latest
    alias: redis

.development_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always

ruby::rubocop:
  extends: .development_rules
  image: ruby:3.2.2
  stage: lint
  script:
    - bundle install -j $(nproc) --retry 3
    - bundle exec rubocop .

ruby::rspec:
  extends: .development_rules
  image: ruby:3.2.2
  stage: test
  artifacts:
    when: always
    paths:
      - coverage/
  variables:
    DATABASE_HOST: "postgres"
    DATABASE_PORT: "5432"
    DATABASE_USERNAME: "decidim"
    DATABASE_PASSWORD: "TEST-insecure_password"
    DISABLED_DOCKER_COMPOSE: "true"
    DISABLE_SPRING: "1"
    SIMPLECOV: 1
    CI: 1
    NODE_MAJOR: 18
  before_script:
    - bash bin/ci-setup
  script:
    - unset DATABASE_URL && RAILS_ENV=test bundle exec rspec
