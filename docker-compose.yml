version: "3"
services:
  decidim-app:
    container_name: decidim-only-form-app
    entrypoint: ""
    build: .
    user: "root"
    environment:
      - RAILS_ENV=development
      - NODE_ENV=development
      - RAILS_SERVE_STATIC_FILES=true
      - DATABASE_URL=postgres://decidim:insecure-password@pg:5432/decidim
      - SECRET_KEY_BASE=pleaseChangeMe
      - DECIDIM_SYSTEM_PASSWORD=decidim123456789
      - DECIDIM_SYSTEM_EMAIL=system@example.org
      - WEB_CONCURRENCY=0
      - RAILS_MAX_THREADS=2
      - RAILS_MIN_THREADS=1
    depends_on:
      pg:
        condition: service_healthy
    links:
      - pg
    ports:
      - 3000:3000
      - 3035:3035
    volumes:
      - .:/home/decidim/decidim_module_only_forms
      - node_modules:/home/decidim/app/node_modules
      - bundle:/home/decidim/app/vendor
      - public:/home/decidim/app/public
      - tmp:/home/decidim/app/tmp
    networks:
      - private
      - default

  pg:
    image: postgres:14-alpine
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=insecure-password
      - POSTGRES_USER=decidim
      - POSTGRES_DB=decidim
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -U decidim -h 127.0.0.1
      interval: 5s
 
volumes:
  bundle: {}
  pg_data: {}
  public: {}
  node_modules: {}
  tmp: {}
networks:
  private:
    internal: true
