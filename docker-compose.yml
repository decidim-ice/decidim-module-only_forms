services:
  only_forms:
    container_name: decidim-only_forms
    command: bash -c "sleep infinity"
    image: octree/decidim-dev:0.32
    entrypoint: ""
    working_dir: /home/module
    volumes:
      - .:/home/module
      - bundle:/home/decidim/vendor
      - node_modules:/home/decidim/node_modules
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://decidim:pleaseChangeMe@only-forms-pg:5432/decidim
      - DATABASE_HOST=only-forms-pg
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=decidim
      - DATABASE_PASSWORD=pleaseChangeMe
      - DEV_MODULE=decidim-only_forms
      - RAILS_ENV=development
      - DISABLED_DOCKER_COMPOSE=true
      - DECIDIM_FORCE_SSL=false
      - DISABLE_SPRING=1
    depends_on:
      - only-forms-pg
    ports:
      - 3000:3000
    links:
      - only-forms-pg

  only-forms-pg:
    container_name: decidim-only_forms_pg
    image: postgres:17
    volumes:
      - only_forms_pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DATABASE=decidim
      - POSTGRES_USER=decidim
      - POSTGRES_PASSWORD=pleaseChangeMe

volumes:
  node_modules: {}
  bundle: {}
  only_forms_pg-data: {}
